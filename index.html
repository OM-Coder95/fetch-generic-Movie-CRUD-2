<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie CRUD 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container pt-5 mb-5">
        <div class="row">
            <div class="col-6">
                <a href="index.html" class="logo"><img src="./assets/img/netflixLogo.svg" alt="NetflixLogo"
                        title="NetflixLogo"></a>
            </div>
            <div class="col-6 text-right align-self-center">
                <button class="btn btn-sm net-pri-btn" id="showMovieModal">Add Movie</button>
            </div>
        </div>
    </div>

    <!-- Movie Card -->
    <div class="container-fluid">
        <div class="row" id="movieContainer">

            <div class="col-md-3 mb-3">
                <div class="card movieCard">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="m-0">Movie Name<h4>
                                <h5 class="m-0"><span class="badge badge-success">4.2</span></h5>
                    </div>
                    <div><small id="releaseDate">Release At: </small></div>
                    <div><small id="UpdateDate">Updated At: </small></div>

                    <div class="card-body py-0">
                        <figure class="m-0">
                            <img src="./assets/img/sitaraman.jpg" alt="sitaRaman">
                            <figcaption class="m-0">
                                <h4 class="m-0">Movie Name</h4>
                                <small class="genre" id="genre">Genre : Action</small>
                                <p class="m-0">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Repellat
                                    eligendi hic ab at Lorem ipsum dolor sit amet consectetur, adipisicing elit. Aliquam
                                    quisquam asperiores est alias nulla molestias ab cumque quasi optio perferendis?
                                    aliquid alias impedit, optio sunt quas ratione.</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button class="btn btn-sm net-sec-btn">Edit</button>
                        <button class="btn btn-sm net-pri-btn">Remove</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <div class="movieModal" id="movieModal">
        <form id="form">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h4 class="m-0">Add Movie</h4>
                    <i role="button" class="fa-solid fa-xmark fa-2x" id="closeMovieModalIcon"></i>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="movieName">Movie Name</label>
                                <input type="text" class="form-control" id="movieName">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="movieRating">Movie Rating</label>
                                <input type="number" id="movieRating" class="form-control">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="releaseDate">Release Date</label>
                                <input type="date" class="form-control" id="releaseDate">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="movieImg">Movie Image</label>
                        <input type="text" class="form-control" id="movieImg">
                    </div>

                    <div class="form-group">
                        <label for="movieDescription">Movie Description</label>
                        <textarea class="form-control" rows="3" id="movieDescription"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <select id="genre" class="form-control">
                            <option value="" disabled>Select Genre</option>
                            <option value="action">Action</option>
                            <option value="comedy">Comedy</option>
                            <option value="horror">Horror</option>
                            <option value="sci-fi">Sci-Fi</option>
                            <option value="drama">Drama</option>
                        </select>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm net-sec-btn" id="addMovieBtn">Add Movie</button>
                    <button type="button" class="btn btn-sm net-sec-btn d-none" id="updateMovieBtn">Update
                        Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn" id="movieModalCloseBtn">Close</button>
                </div>
            </div>
        </form>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
